
name: Sales ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Train sales model
        run: python train_model.py
        
      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest discover -v

      - name: Run prediction API tests
        run: python -m unittest test_app.py -v

        
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp sales_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf "Sales Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: sales-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sales-ml-artifacts
          path: |
            sales_training_data.csv
            sales_model.pkl
            metrics.json
          if-no-files-found: error
          retention-days: 7

      - name: Build Docker image
        run: docker build -t sales-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name sales-ml-container \
            -p 5000:5000 \
            sales-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          echo "Application did not become ready."
          docker logs sales-ml-container
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Quantity_Sold": 10,
              "Unit_Cost": 50,
              "Discount": 0.1,
              "Region_Code": 1,
              "Product_Code": 2
            }' \
            http://localhost:5000/predict

      - name: Show Docker container logs
        if: always()
        run: docker logs sales-ml-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f sales-ml-container || true


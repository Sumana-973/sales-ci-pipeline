
name: Sales ML Docker Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sumana-973/sales-ml

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Start container
        run: |
          docker run -d \
            --name sales-ml-test \
            -p 5000:5000 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Test health endpoint
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          docker logs sales-ml-test
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"Quantity_Sold":10,"Unit_Cost":50,"Discount":0.1,"Region_Code":1,"Product_Code":2}' \
            http://localhost:5000/predict

      - name: Stop test container
        if: always()
        run: docker rm -f sales-ml-test || true

      - name: Publish Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker tag \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
